<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - InfoClass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="connexion">
    <header>
        <h1>InfoClass</h1>

        <nav>
            <a href="index.html">Sign up</a>
            <a href="connexion.html">Sign in</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Sign in</h2>
        <p>Enter your email address and password.</p>

        <form>
            <div>
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
            </div>

            <div>
                <label for="mot-de-passe">Password:</label>
                <input
                    type="password"
                    id="mot-de-passe"
                    name="motDePasse" autocomplete="current-password" maxlength="128"
                    minlength="8"
                    required
                >
            </div>

            <button type="submit">Sign in</button>
        </form><p id="statut" class="statut" role="status" aria-live="polite"></p>
    </main>
    <script src="config.js"></script><script src="script.js"></script>
    
</body>
</html>
