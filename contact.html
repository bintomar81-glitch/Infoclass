<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - InfoClass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
    <header>
        <h1>InfoClass</h1>

        <nav>
            <a href="index.html">Sign up</a>
            <a href="connexion.html">Sign in</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Contact us</h2>
        <p>Have a question about our courses? Send us a message.</p>

        <form>
            <div>
                <label for="nom">Full name:</label>
                <input type="text" id="nom" name="nom" maxlength="100" autocomplete="name" required>
            </div>

            <div>
                <label for="email">Email address:</label>
                <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
            </div>

            <div>
                <label for="sujet">Subject:</label>
                <input type="text" id="sujet" name="sujet" maxlength="150" required>
            </div>

            <div>
                <label for="message">Your message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="5" maxlength="5000"
                    required
                ></textarea>
            </div>

            <button type="submit">Send message</button>
        </form><p id="statut" class="statut" role="status" aria-live="polite"></p>
    </main>
    <script src="config.js"></script><script src="script.js"></script>
</body>
</html>
