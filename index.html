<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up - InfoClass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="inscription">
    <header>
        <h1>InfoClass</h1>

        <nav>
            <a href="index.html">Sign up</a>
            <a href="connexion.html">Sign in</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Sign up for a course</h2>
        <p>Complete the form to start learning.</p>
        <form>
    <fieldset class="choix-cours">
      <legend>Choose your course</legend>
      <p class="aide-cours">Select the course you would like to take.</p>
      <div class="grille-cours">
        <label class="carte-cours" style="--accent: #186755; --teinte: #edf8f3">
          <input type="radio" name="cours" value="bureautique" required>
          <span class="icone-cours" aria-hidden="true">▦</span>
          <span class="titre-cours">Office Skills</span>
          <span class="description-cours">Word, Excel and PowerPoint: create documents, spreadsheets and presentations.</span>
          <span class="niveau-cours">Beginner friendly</span>
          <span class="selection-cours" aria-hidden="true">✓ Course selected</span>
        </label>
        <label class="carte-cours" style="--accent: #2551b2; --teinte: #eef3ff">
          <input type="radio" name="cours" value="html-css" required>
          <span class="icone-cours" aria-hidden="true">&lt;/&gt;</span>
          <span class="titre-cours">HTML and CSS</span>
          <span class="description-cours">Build your first web pages and learn how to style them.</span>
          <span class="niveau-cours">Beginner friendly</span>
          <span class="selection-cours" aria-hidden="true">✓ Course selected</span>
        </label>
        <label class="carte-cours" style="--accent: #8b5411; --teinte: #fff6e6">
          <input type="radio" name="cours" value="javascript" required>
          <span class="icone-cours" aria-hidden="true">JS</span>
          <span class="titre-cours">JavaScript</span>
          <span class="description-cours">Make your pages interactive with buttons, forms and animations.</span>
          <span class="niveau-cours">After HTML and CSS</span>
          <span class="selection-cours" aria-hidden="true">✓ Course selected</span>
        </label>
      </div>
    </fieldset>
    <div>
        <label for="nom">Full name:</label>
        <input type="text" id="nom" name="nom" maxlength="100" autocomplete="name" required>
    </div>

    <div>
        <label for="email">Email address:</label>
        <input type="email" id="email" name="email" maxlength="254" autocomplete="email" required>
    </div>


<div>
    <label for="mot-de-passe">Password:</label>
    <input
        type="password"
        id="mot-de-passe"
        name="motDePasse" autocomplete="new-password" maxlength="128"
        minlength="8"
        required
    >
</div>

    <button type="submit">Create account</button>
</form><p id="statut" class="statut" role="status" aria-live="polite"></p>

    </main>
    <script src="config.js"></script><script src="script.js"></script>
</body>
</html>
