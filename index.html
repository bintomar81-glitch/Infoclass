<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - InfoClass</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>InfoClass</h1>

        <nav>
            <a href="index.html">Inscription</a>
            <a href="connexion.html">Connexion</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <h2>Inscris-toi à un cours</h2>
        <p>Remplis le formulaire pour commencer ton apprentissage.</p>
        <form>
    <div>
        <label for="nom">Nom complet :</label>
        <input type="text" id="nom" name="nom" required>
    </div>

    <div>
        <label for="email">Adresse e-mail :</label>
        <input type="email" id="email" name="email" required>
    </div>
    <div>
    <label for="cours">Choisis ton cours :</label>
    <select id="cours" name="cours" required>
        <option value="">Sélectionne un cours</option>
        <option value="html-css">HTML et CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="bureautique">Bureautique</option>
    </select>
</div>

<div>
    <label for="mot-de-passe">Mot de passe :</label>
    <input
        type="password"
        id="mot-de-passe"
        name="motDePasse"
        minlength="8"
        required
    >
</div>

    <button type="submit">S’inscrire</button>
</form>

    </main>
    <script src="script.js"></script>
</body>
</html>
